name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    
    permissions:
      # CRITICAL: This permission is required for Trusted Publishing via OIDC
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5.3.0 # Always use an explicit, fixed version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml" # Pulls python version automatically

      - name: Extract Version Tag
        id: get_version
        run: |
          # Strips the leading 'v' from the tag (e.g., v1.2.3 -> 1.2.3)
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Package with Dynamic Version
        run: |
          # Overwrites pyproject.toml version dynamically with the release tag
          uv build --version ${{ steps.get_version.outputs.VERSION }}

      - name: Publish Package to PyPI
        run: |
          # Automatically uses OIDC tokens since id-token: write is allowed
          uv publish